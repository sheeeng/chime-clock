name: Build Check

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 'lts/*'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Set Build Information
      id: set-build-information
      run: echo "commit_sha_8_char=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

    - name: Build
      run: npm run build
      env:
        VITE_GIT_COMMIT_SHA_8_CHAR: ${{ steps.set-build-information.outputs.commit_sha_8_char }}
