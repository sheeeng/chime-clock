name: Review Dependency

on:
  pull_request:

concurrency: ${{ github.workflow }}-${{ github.ref_name }}

permissions: {}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Review Dependency
        uses: actions/dependency-review-action@v5.0.0
